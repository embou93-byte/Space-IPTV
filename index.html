<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Mini IA Améliorée</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f0f13;
      color: #e8e8ed;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 14px 18px;
      background: #1a1a22;
      border-bottom: 1px solid #2a2a35;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
    }
    .dot {
      width: 9px; height: 9px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 85%;
      padding: 11px 15px;
      border-radius: 18px;
      line-height: 1.45;
      font-size: 15px;
      animation: fade 0.22s ease;
      word-wrap: break-word;
    }
    @keyframes fade {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: none; }
    }
    .user {
      align-self: flex-end;
      background: #3b82f6;
      color: white;
      border-bottom-right-radius: 5px;
    }
    .bot {
      align-self: flex-start;
      background: #1e1e28;
      border: 1px solid #2a2a35;
      border-bottom-left-radius: 5px;
    }
    .msg img {
      max-width: 100%;
      border-radius: 12px;
      margin-top: 6px;
      display: block;
    }
    .typing {
      align-self: flex-start;
      color: #888;
      font-size: 13px;
      padding: 4px 8px;
    }
    footer {
      padding: 12px;
      background: #1a1a22;
      border-top: 1px solid #2a2a35;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    #input {
      flex: 1;
      background: #0f0f13;
      border: 1px solid #2a2a35;
      border-radius: 14px;
      padding: 12px 14px;
      color: white;
      font-size: 15px;
      outline: none;
    }
    #input:focus { border-color: #3b82f6; }
    button, .icon-btn {
      background: #3b82f6;
      border: none;
      color: white;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    button:hover, .icon-btn:hover { background: #2563eb; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #photoBtn {
      background: #374151;
    }
    #photoBtn:hover { background: #4b5563; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>
  <header>
    <div class="dot"></div>
    Mini IA • version améliorée
  </header>

  <div id="chat">
    <div class="msg bot">
      Salut ! Je suis une version améliorée.<br><br>
      Tu peux me parler normalement, et aussi m’envoyer des photos (bouton 📷).<br>
      Pose-moi n’importe quelle question 😊
    </div>
  </div>

  <footer>
    <button class="icon-btn" id="photoBtn" title="Prendre / envoyer une photo">📷</button>
    <input type="file" id="photoInput" accept="image/*" capture="environment">
    <input type="text" id="input" placeholder="Écris ton message..." autocomplete="off">
    <button id="send">➤</button>
  </footer>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const photoBtn = document.getElementById('photoBtn');
    const photoInput = document.getElementById('photoInput');

    // Mémoire de conversation (session)
    let history = [];

    // Base de connaissances améliorée
    const knowledge = [
      { keys: ['bonjour', 'salut', 'hey', 'hello', 'coucou', 'bonsoir'], 
        reply: ['Salut ! Comment ça va ?', 'Hey ! Content de te parler.', 'Bonjour ! Qu’est-ce que tu veux faire ?'] },
      { keys: ['ça va', 'comment vas-tu', 'tu vas bien', 'cv'], 
        reply: ['Je vais super bien, merci ! Et toi ?', 'Toujours au top. Et de ton côté ?'] },
      { keys: ['qui es-tu', 'tu es qui', 'présente-toi', 'c\'est quoi'], 
        reply: ['Je suis une mini IA qui tourne entièrement dans ton navigateur. Je suis plus intelligente que la version de base, et je peux aussi recevoir des photos.'] },
      { keys: ['heure', 'quelle heure'], 
        reply: () => `Il est ${new Date().toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'})}.` },
      { keys: ['date', 'quel jour', 'aujourd\'hui'], 
        reply: () => `On est le ${new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}.` },
      { keys: ['merci', 'thanks', 'thx'], 
        reply: ['Avec plaisir !', 'De rien 😊', 'Content d’avoir pu aider.'] },
      { keys: ['bye', 'au revoir', 'à plus', 'ciao', 'salut'], 
        reply: ['À bientôt !', 'Ciao ! Prends soin de toi.', 'À très vite 👋'] },
      { keys: ['blague', 'joke', 'rigole', 'marrant'], 
        reply: [
          'Pourquoi les développeurs préfèrent le dark mode ? Parce que la lumière attire les bugs.',
          'Un SQL entre dans un bar, s’approche de deux tables et demande : « Je peux me joindre à vous ? »',
          'Comment appelle-t-on un développeur qui ne commente pas son code ? Un optimiste.'
        ] },
      { keys: ['aide', 'help', 'que peux-tu', 'commande'], 
        reply: 'Je peux discuter, répondre à des questions simples, donner l’heure/date, faire des blagues, et recevoir des photos. Essaye de me parler naturellement !' },
      { keys: ['photo', 'image', 'picture'], 
        reply: 'Tu peux m’envoyer une photo avec le bouton 📷. Je l’afficherai dans le chat. Pour l’instant je ne peux pas vraiment l’analyser en profondeur (c’est une limite du navigateur).' },
      { keys: ['intelligent', 'fort', 'nul', 'con'], 
        reply: 'Je fais de mon mieux avec ce que j’ai ! Je suis une IA locale, donc limitée, mais je m’améliore petit à petit.' },
    ];

    function normalize(text) {
      return text.toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^\w\s]/g, ' ');
    }

    function getReply(text) {
      const t = normalize(text);
      history.push({ role: 'user', content: text });

      // Recherche dans la base
      for (const item of knowledge) {
        if (item.keys.some(k => t.includes(normalize(k)))) {
          const r = item.reply;
          const answer = typeof r === 'function' ? r() : 
                         Array.isArray(r) ? r[Math.floor(Math.random() * r.length)] : r;
          history.push({ role: 'bot', content: answer });
          return answer;
        }
      }

      // Réponses contextuelles simples
      if (t.includes('pourquoi') || t.includes('comment')) {
        return 'Bonne question. Peux-tu me donner un peu plus de détails pour que je t’aide mieux ?';
      }
      if (t.includes('peux-tu') || t.includes('tu peux')) {
        return 'Je vais essayer ! Dis-moi exactement ce que tu veux.';
      }

      // Réponses par défaut plus naturelles
      const defaults = [
        'Intéressant... Dis-m’en plus.',
        'Je vois. Tu peux développer un peu ?',
        'Hmm, je ne suis pas sûr d’avoir bien compris. Tu peux reformuler ?',
        'Ok je note. Qu’est-ce que tu veux savoir exactement ?',
        'Je suis encore limité, mais je fais de mon mieux. Reformule autrement si tu veux.',
        'D’accord. Et ensuite ?'
      ];
      const answer = defaults[Math.floor(Math.random() * defaults.length)];
      history.push({ role: 'bot', content: answer });
      return answer;
    }

    function addMessage(content, isUser = false, isImage = false) {
      const div = document.createElement('div');
      div.className = `msg ${isUser ? 'user' : 'bot'}`;
      
      if (isImage) {
        const img = document.createElement('img');
        img.src = content;
        div.appendChild(img);
      } else {
        div.textContent = content;
      }
      
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function showTyping() {
      const div = document.createElement('div');
      div.className = 'typing';
      div.id = 'typing';
      div.textContent = 'IA réfléchit...';
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function hideTyping() {
      const t = document.getElementById('typing');
      if (t) t.remove();
    }

    async function sendText() {
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, true);
      input.value = '';
      sendBtn.disabled = true;

      showTyping();
      await new Promise(r => setTimeout(r, 500 + Math.random() * 700));
      hideTyping();

      addMessage(getReply(text));
      sendBtn.disabled = false;
      input.focus();
    }

    // Gestion des photos
    photoBtn.onclick = () => photoInput.click();

    photoInput.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async (event) => {
        const dataUrl = event.target.result;
        
        // Affiche la photo côté utilisateur
        addMessage(dataUrl, true, true);

        showTyping();
        await new Promise(r => setTimeout(r, 800));
        hideTyping();

        // Réponse de l’IA
        const responses = [
          'Photo bien reçue ! 📷 Je la vois clairement.',
          'Ok j’ai ta photo. Pour l’instant je ne peux pas l’analyser en profondeur (limitation du navigateur), mais je peux en discuter avec toi.',
          'Image reçue. Tu veux me parler de ce qu’il y a dessus ?',
          'Bien reçu. Si tu veux une vraie analyse (description, texte, objets...), il faudra plus tard connecter une API vision.'
        ];
        addMessage(responses[Math.floor(Math.random() * responses.length)]);
      };
      reader.readAsDataURL(file);
      
      // Reset pour pouvoir reprendre la même photo
      photoInput.value = '';
    };

    sendBtn.onclick = sendText;
    input.onkeydown = e => { if (e.key === 'Enter') sendText(); };
    input.focus();
  </script>
</body>
</html>
